name: Tyhpdef reclaim
description: Publish community types again after an owner stopped shipping them
title: "[tyhpdef-reclaim] "
labels:
  - tyhpdef-reclaim
body:
  - type: input
    id: composer-name
    attributes:
      label: PHP Composer name
      description: vendor/name
      placeholder: nesbot/carbon
    validations:
      required: true
  - type: input
    id: majors
    attributes:
      label: Majors to take back
      description: Upstream majors tyhpproject should publish again.
      placeholder: "3"
    validations:
      required: true
  - type: dropdown
    id: reason
    attributes:
      label: Reason
      options:
        - New major with no types
        - Owner request
        - Quality failure
    validations:
      required: true
