name: Tyhpdef ownership
description: Claim bundled or sibling types for a PHP package you maintain on Packagist
title: "[tyhpdef-ownership] "
labels:
  - tyhpdef-ownership
body:
  - type: input
    id: composer-name
    attributes:
      label: PHP Composer name
      description: The Packagist name of the PHP package (vendor/name).
      placeholder: nesbot/carbon
    validations:
      required: true
  - type: dropdown
    id: scenario
    attributes:
      label: Scenario
      description: Where the types ship after handoff.
      options:
        - bundled
        - sibling
    validations:
      required: true
  - type: input
    id: sibling
    attributes:
      label: Sibling Composer name
      description: Required when the scenario is sibling. The Composer name of the types package (vendor/name-tyhpdef).
      placeholder: nesbot/carbon-tyhpdef
    validations:
      required: false
  - type: input
    id: packagist-url
    attributes:
      label: Packagist URL of the PHP package
      description: https://packagist.org/packages/vendor/name
      placeholder: https://packagist.org/packages/nesbot/carbon
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions / majors to hand off
      description: Example 3.14+
      placeholder: 3.14+
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: GitHub source repo
      description: Canonical source repository for the PHP package.
      placeholder: https://github.com/CarbonPHP/carbon
    validations:
      required: true
  - type: textarea
    id: shipped
    attributes:
      label: Packagist signal
      description: Confirm that extra.tyhp.package and/or extra.tyhp.tyhpdef plus "replace" of tyhpdef/vendor-name with self.version already shipped on Packagist.
      placeholder: extra.tyhp.package and "replace": { "tyhpdef/nesbot-carbon": "self.version" } are on Packagist for 3.14.0
    validations:
      required: true
  - type: input
    id: packagist-user
    attributes:
      label: Packagist username
      description: A Packagist username that is a maintainer of vendor/name.
    validations:
      required: true
